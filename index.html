<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinema Stream</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <h1 class="logo">CINEMA STREAM</h1>
    
    <!-- Filter & Search Controls -->
    <div class="controls">
      <input type="text" id="searchInput" placeholder="ရုပ်ရှင် / စီးရီး ရှာရန်...">
      
      <select id="typeSelect">
        <option value="movie">Movies (ရုပ်ရှင်)</option>
        <option value="tv">TV Series (ဇာတ်လမ်းတွဲ)</option>
      </select>

      <select id="genreSelect">
        <option value="">အမျိုးအစား အားလုံး</option>
      </select>
    </div>
  </header>

  <main class="container">
    <div id="movieGrid" class="movie-grid">
      <p class="loading">ရုပ်ရှင်များကို ခေါ်ယူနေပါသည်။ ခေတ္တစောင့်ဆိုင်းပေးပါ...</p>
    </div>
  </main>

  <!-- Video Player Modal (Ads မပါသော Player) -->
  <div id="playerModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" id="closeModal">&times;</span>
      <iframe id="videoIframe" src="" frameborder="0" allowfullscreen></iframe>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
