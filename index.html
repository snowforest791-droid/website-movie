<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinema Stream - Movies & TV Series</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header Section -->
  <header class="navbar">
    <div class="logo">🍿 CINEMA STREAM</div>
    
    <!-- Filter Section (Movies / Series Switcher) -->
    <div class="filter-container">
      <select id="typeSelect" onchange="loadMedia()">
        <option value="movie">🎬 Movies (ရုပ်ရှင်များ)</option>
        <option value="tv">📺 TV Series (စီးရီးများ)</option>
      </select>
    </div>
  </header>

  <!-- Movie/Series Grid Container -->
  <main class="container">
    <div id="movieGrid" class="movie-grid">
      <!-- Media Cards များကို JavaScript မှ Dynamic ထည့်ပေးမည် -->
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
